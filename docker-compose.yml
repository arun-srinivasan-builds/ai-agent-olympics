services:
  ai-agent-olympics:
    build:
      context: .
      dockerfile: Dockerfile

    image: ai-agent-olympics:latest
    container_name: ai-agent-olympics

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:8502:8501"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s